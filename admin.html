<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexRobotics - 관리자 컨트롤 보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-dark: #141b2d;
            --border-color: #1e293b;
            --accent-green: #00df89;
            --accent-blue: #0070f3;
            --accent-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Outfit', 'Noto Sans KR', sans-serif; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .admin-container { width: 100%; max-width: 700px; background: var(--panel-dark); border: 1px solid var(--border-color); border-radius: 20px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { font-size: 1.85rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; color: var(--accent-green); text-align: center; }
        
        /* 암호화 게이트웨이 화면 */
        .auth-box { text-align: center; padding: 2rem 0; }
        .auth-box p { color: var(--text-muted); margin-bottom: 1.5rem; }
        
        /* 폼 요소 그룹 디자인 */
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; color: var(--text-muted); margin-bottom: 0.5rem; font-size: 0.95rem; font-weight: 500; }
        .form-control { width: 100%; padding: 0.85rem 1.2rem; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 1rem; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--accent-blue); outline: none; }
        textarea.form-control { height: 160px; resize: none; }
        
        /* 버튼 공통 스타일 */
        .btn { display: inline-block; width: 100%; padding: 0.9rem; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; color: white; }
        .btn:hover { opacity: 0.9; }
        .btn-blue { background: var(--accent-blue); }
        .btn-green { background: var(--accent-green); color: #000; }
        .btn-danger { background: var(--accent-red); padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 6px; width: auto; }
        
        /* 게시물 테이블형 대시보드 리스트 */
        .manage-header { margin: 3rem 0 1rem; padding-top: 2rem; border-top: 1px solid var(--border-color); color: var(--text-main); font-size: 1.4rem; }
        .post-list-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-dark); padding: 1rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.75rem; }
        .post-info { display: flex; flex-direction: column; gap: 0.25rem; max-width: 80%; }
        .post-title-text { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-meta-text { font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>NEXROBOTICS Console</h1>

        <div id="auth-panel" class="auth-box">
            <p>보안 강화를 위해 본사의 승인 전용 암호를 입력해 주십시오.</p>
            <div class="form-group">
                <input type="password" id="admin-pass-input" class="form-control" placeholder="관리자 보안 비밀번호 입력" style="text-align: center;">
            </div>
            <button class="btn btn-green" onclick="verifyAdminGate()">인증 및 대시보드 접속</button>
        </div>

        <div id="workspace-panel" style="display: none;">
            <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem; color: var(--accent-blue);">📝 새 신규 포스트 등록</h2>
            
            <div class="form-group">
                <label for="new-title">게시물 제목</label>
                <input type="text" id="new-title" class="form-control" placeholder="공지 핵심 타이틀 기입">
            </div>
            
            <div class="form-group">
                <label for="new-content">본문 세부 내용</label>
                <textarea id="new-content" class="form-control" placeholder="줄바꿈 처리 등이 메인 페이지에 그대로 표현됩니다."></textarea>
            </div>
            
            <button class="btn btn-blue" onclick="submitNewPost()">클라우드 데이터베이스에 발행</button>

            <h2 class="manage-header">📋 게시글 이력 관리 및 삭제</h2>
            <div id="admin-list-container">
                </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // [필수 설정 1] 메인 페이지와 반드시 '동일한' Firebase 설정을 기입하세요.
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // [필수 설정 2] 관리자 페이지 전용 접근 비밀번호를 자유롭게 수정하세요.
        const ACCESS_SECRET_KEY = "nexrobotics123!"; 

        // 1. 게이트 패스 인증 함수
        function verifyAdminGate() {
            const inputVal = document.getElementById("admin-pass-input").value;
            if (inputVal === ACCESS_SECRET_KEY) {
                document.getElementById("auth-panel").style.display = "none";
                document.getElementById("workspace-panel").style.display = "block";
                startLoadingDashboard();
            } else {
                alert("인증에 실패하였습니다. 비밀번호를 다시 확인하세요.");
            }
        }

        // 2. 파이어베이스 새 포스트 추가 함수
        function submitNewPost() {
            const title = document.getElementById("new-title").value.trim();
            const content = document.getElementById("new-content").value.trim();

            if (!title || !content) {
                alert("제목과 본문 요소를 빠짐없이 기입해 주세요.");
                return;
            }

            db.collection("posts").add({
                title: title,
                content: content,
                likes: 0,
                dislikes: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Cloud Firestore 데이터베이스에 성공적으로 저장 및 배포되었습니다.");
                // 입력칸 초기화
                document.getElementById("new-title").value = "";
                document.getElementById("new-content").value = "";
            })
            .catch((error) => {
                console.error("데이터 저장 실패: ", error);
                alert("업로드 실패: 권한이 없거나 네트워크 통신 오류입니다.");
            });
        }

        // 3. 관리자용 삭제 연동 백그라운드 리스너
        function startLoadingDashboard() {
            db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const listContainer = document.getElementById("admin-list-container");
                listContainer.innerHTML = "";

                if (snapshot.empty) {
                    listContainer.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:1rem;">데이터베이스에 기록된 내용이 전무합니다.</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const postId = doc.id;
                    
                    let dateStr = "날짜 대기중";
                    if(post.createdAt) {
                        const d = post.createdAt.toDate();
                        dateStr = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
                    }

                    const itemHtml = `
                        <div class="post-list-item">
                            <div class="post-info">
                                <span class="post-title-text">${post.title}</span>
                                <span class="post-meta-text">날짜: ${dateStr} | 👍 ${post.likes || 0}  👎 ${post.dislikes || 0}</span>
                            </div>
                            <button class="btn btn-danger" onclick="executeDeletePost('${postId}')">삭제</button>
                        </div>
                    `;
                    listContainer.innerHTML += itemHtml;
                });
            });
        }

        // 4. 데이터베이스 영구 삭제 함수
        function executeDeletePost(postId) {
            if (confirm("해당 포스트를 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.")) {
                db.collection("posts").doc(postId).delete()
                .then(() => {
                    alert("성공적으로 파기되었습니다.");
                })
                .catch((error) => {
                    alert("삭제 과정 중 문제가 발생했습니다.");
                });
            }
        }
    </script>
</body>
</html>
