<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexRobotics - 관리자 컨트롤 센터</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-dark: #0b0f19; --card-dark: #141b2d; --border: #1e293b; --text-light: #f8fafc; --text-muted: #94a3b8; --danger: #ef4444; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 40px 20px; }
        .admin-container { max-width: 1000px; margin: 0 auto; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-family: 'Outfit', sans-serif; margin: 0; font-size: 2rem; }
        h1 span { color: #ef4444; font-size: 0.9rem; letter-spacing: 2px; margin-left: 10px; border: 1px solid #ef4444; padding: 2px 6px; border-radius: 4px; }
        .section-title { font-size: 1.25rem; margin-bottom: 20px; color: var(--text-light); display: flex; align-items: center; gap: 8px; }
        
        /* 테이블 스타일 */
        .post-table { width: 100%; border-collapse: collapse; background: var(--card-dark); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .post-table th, .post-table td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); }
        .post-table th { background: #1e293b; color: var(--text-light); font-weight: 700; font-size: 0.95rem; }
        .post-table td { color: var(--text-muted); font-size: 0.95rem; }
        .post-title-td { color: var(--text-light); font-weight: 500; }
        .delete-btn { background: var(--danger); border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: background 0.2s; }
        .delete-btn:hover { background: #dc2626; }
        .empty-tr { text-align: center; padding: 40px !important; color: var(--text-muted); }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>NexRobotics <span>ADMIN CONTROL</span></h1>
            <a href="index.html" class="back-link">&larr; 메인 홈으로 가기</a>
        </header>

        <main>
            <div class="section-title">🗑️ 전체 게시글 모니터링 및 삭제 관리</div>
            
            <table class="post-table">
                <thead>
                    <tr>
                        <th style="width: 25%;">작성일자</th>
                        <th style="width: 50%;">게시글 제목</th>
                        <th style="width: 15%;">반응 (👍/👎)</th>
                        <th style="width: 10%; text-align: center;">관리</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <tr>
                        <td colspan="4" class="empty-tr">데이터를 동기화 중입니다...</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <script>
        // Firebase Config 정보 입력 (index.html과 동일한 계정 설정 필수)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 실시간으로 전체 글을 테이블 형식으로 렌더링
        function listenAndManagePosts() {
            db.collection("posts").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById("admin-table-body");
                
                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-tr">현재 등록된 게시글이 없습니다.</td></tr>';
                    return;
                }

                tbody.innerHTML = "";

                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const postId = doc.id;

                    let dateString = "-";
                    if (post.createdAt) {
                        const date = post.createdAt.toDate();
                        dateString = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                    }

                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${dateString}</td>
                        <td class="post-title-td">${escapeHtml(post.title)}</td>
                        <td>👍 ${post.likes || 0} / 👎 ${post.dislikes || 0}</td>
                        <td style="text-align: center;">
                            <button class="delete-btn" onclick="deletePost('${postId}')">삭제</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // 특정 게시글을 삭제하는 기능 함수
        function deletePost(postId) {
            if (confirm("정말로 이 게시글을 영구 삭제하시겠습니까?\n하위 댓글 데이터도 함께 격리됩니다.")) {
                db.collection("posts").doc(postId).delete()
                .then(() => {
                    alert("게시글이 성공적으로 삭제되었습니다.");
                })
                .catch((error) => {
                    console.error("삭제 실패:", error);
                    alert("삭제 작업 중 오류가 발생했습니다.");
                });
            }
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.addEventListener('DOMContentLoaded', listenAndManagePosts);
    </script>
</body>
</html>
